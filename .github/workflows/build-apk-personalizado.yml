      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wget unzip

          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O tools.zip

          unzip -q tools.zip
          mv cmdline-tools latest

          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Instalar Apktool
        shell: bash
        run: |
          set -euo pipefail

          sudo wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            -O /usr/local/bin/apktool.jar

          printf '#!/bin/sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            | sudo tee /usr/local/bin/apktool >/dev/null

          sudo chmod +x /usr/local/bin/apktool
          apktool --version
          zipalign -h >/dev/null
          apksigner version