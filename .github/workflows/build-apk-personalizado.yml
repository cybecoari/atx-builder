name: Build APK Personalizado

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Nome exibido no Android
        required: true
        type: string
        default: ATX Cliente
      credential:
        description: Credencial ATX deste cliente
        required: true
        type: string
      package_name:
        description: Novo pacote Android (ex. com.cliente.app)
        required: true
        type: string
        default: com.atx.cliente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zipalign
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -O /usr/local/bin/apktool.jar
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          sudo sed -i 's|^exec java -jar .*|exec java -jar /usr/local/bin/apktool.jar "$@"|' /usr/local/bin/apktool

      - name: Baixar Android build-tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" > /dev/null
          echo "ANDROID_BT=$HOME/android-sdk/build-tools/35.0.0" >> $GITHUB_ENV

      - name: Desmontar APK original
        run: apktool d -f atx_3.0_src.apk -o decoded

      - name: Renomear pacote
        env:
          NEW_PACKAGE: ${{ inputs.package_name }}
        run: python3 scripts/rename_package.py decoded "$NEW_PACKAGE"

      - name: Personalizar nome e credencial
        env:
          APP_NAME: ${{ inputs.app_name }}
          ATX_CREDENTIAL: ${{ inputs.credential }}
        run: python3 scripts/customize.py decoded "$APP_NAME" "$ATX_CREDENTIAL"

      - name: Reconstruir APK
        run: |
          apktool b decoded -o atx-unsigned.apk
          $ANDROID_BT/zipalign -f 4 atx-unsigned.apk atx-aligned.apk

      - name: Assinar APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > $RUNNER_TEMP/ks.jks
          $ANDROID_BT/apksigner sign --ks $RUNNER_TEMP/ks.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out atx-signed.apk atx-aligned.apk
          $ANDROID_BT/apksigner verify --verbose atx-signed.apk
          rm -f $RUNNER_TEMP/ks.jks

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: atx-apk-personalizado
          path: atx-signed.apk
          retention-days: 7
