name: Criar Keystore

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar keystore
        run: |
          keytool -genkey -v \
            -keystore atx-release.keystore \
            -alias atxkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass atxsenha123 \
            -keypass atxsenha123 \
            -dname "CN=ATX, OU=Dev, O=ATX, L=Cidade, S=Estado, C=BR"

      - name: Converter para base64
        run: |
          echo "=== COPIE O TEXTO ABAIXO E COLE NO SECRET ANDROID_KEYSTORE_BASE64 ==="
          echo ""
          base64 -w0 atx-release.keystore
          echo ""
          echo ""
          echo "=== FIM ==="

      - name: Publicar keystore original
        uses: actions/upload-artifact@v4
        with:
          name: keystore-original
          path: atx-release.keystore
          retention-days: 30
